name: CI Pipeline

on:
  push:
    branches: [ "main", "dev-merged" ]
  pull_request:
    branches: [ "main", "dev-merged" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke import
        run: |
          cd backend
          python -c "import app.api.tasks; import app.api.memory_api"
      - name: Run Tests
        run: |
          cd backend
          python -m pytest tests/ -v --asyncio-mode=auto

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type Check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
