services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aether_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo ok || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aether_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPIK_API_KEY: "" 
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      REDIS_URL: redis://redis:6379/0
      KIMI_K2_MODEL: ${KIMI_K2_MODEL}
      KIMI_BASE_URL: ${KIMI_BASE_URL}
      KIMI_MODEL: ${KIMI_MODEL}
      KIMI_API_KEY: ${KIMI_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DATABASE_URL: postgresql+asyncpg://aether:aether@postgres:5432/aether
      COGNEE_ENABLED: "true"
      SANDBOX_ENABLED: "true"
      RBAC_ENABLED: "false"
      MORNING_BRIEFING_TIME: ${MORNING_BRIEFING_TIME:-08:00}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - aether_kuzu:/tmp/aether # Persistent storage for KuzuDB
      - aether_sandbox:/tmp/aether/sandbox # For Python REPL sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health' )"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aether_network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aether_network

networks:
  aether_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  aether_sandbox:
  aether_kuzu:
